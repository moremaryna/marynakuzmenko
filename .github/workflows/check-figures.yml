name: Training figures

# Checks the numbers, dates and law on /training/ (src/_data/training.js)
# against aiinagriculture.org and against each primary source. Runs every
# Monday, and whenever the training data or page changes. A failure opens one
# issue labelled training-figures, or comments on the one already open.
# Nothing here edits the data: see scripts/check-figures.js.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/_data/training.js
      - src/training/**
      - scripts/check-figures.js

permissions:
  contents: read
  issues: write

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check figures
        id: check
        continue-on-error: true
        run: npm run check:figures -- --report=figures-report.md

      - name: Report problems
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create training-figures --color B60205 --description "Numbers or law on /training/ need review" --force
          open=$(gh issue list --label training-figures --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file figures-report.md
          else
            gh issue create --title "/training/: figures or law need review" --label training-figures --body-file figures-report.md
          fi
          exit 1
